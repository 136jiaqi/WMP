<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wand Pulse 竞品监控</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0b1020;color:#e7edf8}body{max-width:1280px;margin:0 auto;padding:36px 22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0 0 8px}p,.muted{color:#9caecb}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.card{background:#141e33;border:1px solid #27344e;border-radius:14px;padding:20px}.number{font-size:26px;font-weight:700;margin-top:10px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}select,input,button{background:#19263d;color:#e7edf8;border:1px solid #344766;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer}button:hover{background:#29416b}.notice{padding:14px;background:#42321c;border:1px solid #97752e;border-radius:10px;margin:16px 0;white-space:pre-line}.table{overflow:auto;border:1px solid #27344e;border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:14px;border-bottom:1px solid #27344e}th{background:#18243b;color:#a7b8d2;font-size:13px}.positive{color:#6fe0b0}.negative{color:#ff9a9a}tbody tr:hover{background:#18243b}.tag{padding:5px 9px;background:#253754;border-radius:6px;font-size:12px}svg{width:100%;height:auto;max-height:270px}.history{margin-top:30px}footer{color:#8093b1;font-size:12px;margin-top:26px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}header{display:block}h1{font-size:23px}body{padding:22px 12px}}
</style></head><body>
<header><div><h1>Wand Pulse · 竞品监控</h1><p>投票趋势与 XMod 开发状态</p></div><button id="reload">刷新数据</button></header>
<div id="notice" class="notice" hidden></div>
<div class="cards"><div class="card">榜单游戏<div class="number" id="count">—</div></div><div class="card">总点数<div class="number" id="points">—</div></div><div class="card">已发布<div class="number" id="published">—</div></div><div class="card">快照数<div class="number" id="snapshots">—</div></div></div>
<div class="muted" id="stamp">正在加载…</div>
<div class="controls"><select id="date" aria-label="日期"></select><input id="search" placeholder="搜索游戏" aria-label="搜索游戏"><select id="status" aria-label="开发状态"><option value="">全部开发状态</option></select><select id="sort" aria-label="排序"><option value="rank">按排名</option><option value="points">按点数</option><option value="growth">按增长率</option><option value="name">按名称</option></select><button id="copy">复制全部筛选结果</button></div>
<div class="table"><table><thead><tr><th>排名</th><th>游戏</th><th>点数</th><th>环比增长</th><th>开发状态</th><th>平台</th><th>获取时间</th></tr></thead><tbody id="rows"></tbody></table></div>
<section class="history"><h2>游戏历史趋势</h2><select id="game" aria-label="历史游戏"></select><div id="chart"></div><div class="table"><table><thead><tr><th>日期</th><th>点数</th><th>环比</th></tr></thead><tbody id="history"></tbody></table></div></section>
<footer>时间均为 UTC+8。环比对比上一有数据日期的最终快照。每分钟检查一次已发布数据。未查询状态与未收录分开展示。</footer>
<script>
'use strict';
const $=id=>document.getElementById(id), labels={PUBLISHED:'已发布',COMPLETED:'已完成',REVIEW:'审核中',IN_PROGRESS:'开发中',QUEUED:'排队中',NOT_DEVELOPED:'未开发',NOT_FOUND:'未收录'};
let data={snapshots:[],statuses:{}},visible=[];
function cell(parent,text,cls=''){const e=document.createElement('td');e.textContent=text;e.className=cls;parent.appendChild(e);return e;}
function option(select,value,text){const o=document.createElement('option');o.value=value;o.textContent=text;select.appendChild(o);}
function daily(){const result=new Map();for(const s of data.snapshots)result.set(s.time.slice(0,10),s);return [...result.values()];}
function growth(points,prior){return prior>0?(points-prior)/prior*100:null;}
function pct(value){return value===null?'—':`${value>=0?'+':''}${value.toFixed(2)}%`;}
function state(name){const s=data.statuses[name];if(!s)return '待查询';const age=Date.now()-Date.parse(s.cachedAt);return (labels[s.status]||'待查询')+(!Number.isFinite(age)||age>86400000?'（缓存过期）':'');}
function render(){
 const days=daily(), index=days.findIndex(s=>s.time.slice(0,10)===$('date').value),s=days[index];$('rows').replaceChildren();visible=[];
 if(!s){const tr=document.createElement('tr');cell(tr,'暂无有效数据');$('rows').appendChild(tr);return;}
 const previous=new Map((days[index-1]?.rows||[]).map(r=>[r.name,r.points]));
 const all=s.rows.map(r=>({...r,growth:growth(r.points,previous.get(r.name))}));
 visible=all.filter(r=>r.name.toLowerCase().includes($('search').value.toLowerCase())&&(!$('status').value||data.statuses[r.name]?.status===$('status').value));
 const sort=$('sort').value;visible.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='growth'?(b.growth??-Infinity)-(a.growth??-Infinity):sort==='points'?b.points-a.points:a.rank-b.rank);
 for(const r of visible){const tr=document.createElement('tr');cell(tr,r.rank);const name=cell(tr,'');const b=document.createElement('button');b.textContent=r.name;b.onclick=()=>{$('game').value=r.name;history();};name.appendChild(b);cell(tr,r.points.toLocaleString());cell(tr,pct(r.growth),r.growth<0?'negative':'positive');cell(tr,state(r.name));cell(tr,r.platform||data.statuses[r.name]?.platform||'—');cell(tr,s.time);$('rows').appendChild(tr);}
 $('count').textContent=s.rows.length;$('points').textContent=s.rows.reduce((n,r)=>n+r.points,0).toLocaleString();$('published').textContent=s.rows.filter(r=>data.statuses[r.name]?.status==='PUBLISHED').length;$('snapshots').textContent=data.snapshots.length;$('stamp').textContent=`榜单时间：${s.time} · 已显示 ${visible.length} 款`;
 const latest=data.snapshots.at(-1),age=Date.now()-Date.parse(latest.time.replace(' ','T')+'+08:00');const warnings=[data.warning];if(age>21600000)warnings.push('数据已超过 6 小时未更新，请检查本机采集任务。');if(age< -300000)warnings.push('数据时间异常，请检查本机时钟。');$('notice').textContent=warnings.filter(Boolean).join('\n');$('notice').hidden=!$('notice').textContent;
}
function history(){
 const name=$('game').value, series=daily().flatMap(s=>{const r=s.rows.find(r=>r.name===name);return r?[{date:s.time.slice(0,10),points:r.points}]:[];});$('history').replaceChildren();let prior=null;
 for(const r of series){const tr=document.createElement('tr');cell(tr,r.date);cell(tr,r.points.toLocaleString());cell(tr,pct(growth(r.points,prior)));prior=r.points;$('history').appendChild(tr);}
 $('chart').replaceChildren();if(series.length<2){$('chart').textContent='至少需要两个日期的数据才能绘制趋势。';return;}
 const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1000 240');svg.setAttribute('role','img');svg.setAttribute('aria-label',name+'点数趋势');const values=series.map(r=>r.points),min=Math.min(...values),max=Math.max(...values),span=max-min||1;
 const poly=document.createElementNS(ns,'polyline');poly.setAttribute('points',series.map((r,i)=>`${30+i*940/(series.length-1)},${210-(r.points-min)/span*175}`).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke','#76b7ff');poly.setAttribute('stroke-width','3');svg.appendChild(poly);$('chart').appendChild(svg);
}
async function load(){try{const response=await fetch('./data/dashboard.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const next=await response.json();if(!Array.isArray(next.snapshots))throw Error('数据格式异常');data=next;const date=$('date').value,game=$('game').value;$('date').replaceChildren();for(const s of daily().reverse())option($('date'),s.time.slice(0,10),s.time.slice(0,10));if([...$('date').options].some(o=>o.value===date))$('date').value=date;$('game').replaceChildren();for(const name of [...new Set(data.snapshots.flatMap(s=>s.rows.map(r=>r.name)))].sort())option($('game'),name,name);if([...$('game').options].some(o=>o.value===game))$('game').value=game;render();history();if(!data.snapshots.length){$('notice').hidden=false;$('notice').textContent='尚未收到本机采集数据，请完成部署后运行首次采集。';}}catch(e){$('notice').hidden=false;$('notice').textContent='加载失败：'+e.message;}}
for(const [key,value]of Object.entries(labels))option($('status'),key,value);
for(const id of ['date','status','sort'])$(id).onchange=render;$('search').oninput=render;$('game').onchange=history;$('reload').onclick=load;
$('copy').onclick=async()=>{const text=['排名\t游戏\t点数\t环比增长\t开发状态\t平台\t获取时间',...visible.map(r=>[r.rank,r.name,r.points,pct(r.growth),state(r.name),r.platform||data.statuses[r.name]?.platform||'',daily().find(s=>s.time.startsWith($('date').value))?.time].map(v=>String(v).replace(/[\t\r\n]/g,' ')).join('\t'))].join('\n');try{await navigator.clipboard.writeText(text);$('copy').textContent='已复制';}catch{const area=document.createElement('textarea');area.value=text;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();$('copy').textContent='已复制';}};
load();setInterval(load,60000);
</script></body></html>

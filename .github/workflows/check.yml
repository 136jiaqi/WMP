name: Check code
on:
  push:
    paths: ['collector/**', 'scripts/**', 'tests/**', '.github/workflows/check.yml']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: dotnet build collector/WandPulseGrabber -c Release
      - run: python -m unittest discover -s tests -v
